<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tutor Evolutivo AI</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#050505;
--surface:rgba(255,255,255,.05);
--surface-2:rgba(255,255,255,.03);

--border:rgba(255,255,255,.08);

--text:#f8fafc;
--muted:#a1a1aa;

--primary:#6366f1;
--primary-hover:#7c83ff;

--green:#22c55e;
--orange:#f97316;
--purple:#8b5cf6;
--red:#ef4444;

}

body{

font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
min-height:100vh;

}

h1,h2,h3,.btn{

font-family:'Syne',sans-serif;

}

.background{

position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:-1;

}

.glow{

position:absolute;
border-radius:50%;
filter:blur(140px);
opacity:.22;
animation:float 8s ease-in-out infinite;

}

.glow1{

width:700px;
height:700px;
background:#6366f1;
top:-200px;
right:-200px;

}

.glow2{

width:500px;
height:500px;
background:#8b5cf6;
bottom:-200px;
left:-100px;
animation-delay:2s;

}

@keyframes float{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(30px);
}

}

.glass{

background:var(--surface);
backdrop-filter:blur(22px);
border:1px solid var(--border);

}

.container{

max-width:1280px;
margin:auto;
padding:40px 24px;

}

.grid{

display:grid;
gap:20px;

}

.grid-2{

grid-template-columns:1fr 1fr;

}

.grid-3{

grid-template-columns:repeat(3,1fr);

}

.card{

padding:28px;
border-radius:28px;

}

.hero{

min-height:100vh;
display:flex;
align-items:center;

}

.hero-content{

display:grid;
grid-template-columns:1.1fr .9fr;
gap:80px;
align-items:center;

}

.hero-title{

font-size:clamp(60px,8vw,96px);
line-height:.92;
letter-spacing:-4px;
margin-bottom:24px;

}

.hero-description{

font-size:20px;
line-height:1.8;
color:var(--muted);
max-width:650px;
margin-bottom:40px;

}

.btn{

border:none;
cursor:pointer;
transition:.25s;
font-weight:700;

}

.btn:hover{

transform:translateY(-2px);

}

.btn-primary{

background:var(--primary);
color:white;

}

.btn-primary:hover{

background:var(--primary-hover);

}

.btn-soft{

background:rgba(255,255,255,.05);
border:1px solid var(--border);
color:white;

}

.input{

width:100%;
padding:18px 20px;
border-radius:18px;
background:rgba(255,255,255,.04);
border:1px solid var(--border);
color:white;
font-size:16px;
outline:none;

}

.input:focus{

border-color:var(--primary);

}

.progress{

height:8px;
background:rgba(255,255,255,.05);
border-radius:999px;
overflow:hidden;

}

.progress-bar{

height:100%;
background:linear-gradient(90deg,#6366f1,#8b5cf6);
transition:.5s ease;

}

.fade{

animation:fade .5s ease forwards;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0px);
}

}

.chat{

height:420px;
overflow:auto;
display:flex;
flex-direction:column;
gap:14px;
padding-right:8px;

}

.bubble{

max-width:80%;
padding:16px 18px;
border-radius:20px;
line-height:1.7;

}

.ai{

align-self:flex-start;
background:rgba(99,102,241,.12);
border:1px solid rgba(99,102,241,.2);

}

.user{

align-self:flex-end;
background:rgba(255,255,255,.05);
border:1px solid var(--border);

}

.roadmap-item{

padding:18px;
border-radius:18px;
background:rgba(255,255,255,.03);
border:1px solid var(--border);

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:12px;

}

.level{

display:inline-flex;
align-items:center;
gap:10px;

padding:10px 16px;
border-radius:999px;

background:rgba(99,102,241,.15);
border:1px solid rgba(99,102,241,.2);

}

.modal{

position:fixed;
inset:0;
background:rgba(0,0,0,.75);

backdrop-filter:blur(8px);

display:flex;
align-items:center;
justify-content:center;

padding:24px;

z-index:999;

}

.modal-box{

width:100%;
max-width:620px;

padding:32px;
border-radius:28px;

background:#111;
border:1px solid var(--border);

max-height:85vh;
overflow:auto;

}

.typing{

display:flex;
gap:5px;
padding:4px;

}

.typing span{

width:8px;
height:8px;
border-radius:50%;
background:#8b5cf6;

animation:typing 1.2s infinite ease-in-out;

}

.typing span:nth-child(2){

animation-delay:.2s;

}

.typing span:nth-child(3){

animation-delay:.4s;

}

@keyframes typing{

0%,100%{
transform:scale(.4);
opacity:.5;
}

50%{
transform:scale(1);
opacity:1;
}

}

.lesson-box{

padding:22px;
border-radius:22px;

background:rgba(99,102,241,.08);
border:1px solid rgba(99,102,241,.15);

line-height:1.8;

}

.badge{

padding:12px 18px;
border-radius:999px;
font-size:14px;

}

@media(max-width:900px){

.grid-2,
.grid-3,
.hero-content{

grid-template-columns:1fr;

}

.hero{

padding-top:100px;
padding-bottom:80px;

}

.hero-title{

font-size:58px;

}

}

</style>
</head>

<body>

<div class="background">

<div class="glow glow1"></div>
<div class="glow glow2"></div>

</div>

<div id="app"></div>

<script>

const app = document.getElementById("app")

let currentQuestion = 0

let state = JSON.parse(
localStorage.getItem("tutorAI")
) || {

xp:120,
streak:4,
level:"Consistente",

emotion:"motivado",

emotionHistory:[],

dropRisk:"baixo",

chatHistory:[],

userData:{},

plan:null

}

const questions = [

{
key:"goal",
question:"Qual transformação você busca?",
placeholder:"Ex: Me tornar especialista fiscal"
},

{
key:"motivation",
question:"Por que isso é importante para você?",
placeholder:"Ex: Crescimento profissional"
},

{
key:"time",
question:"Quanto tempo REAL você possui por dia?",
placeholder:"Ex: 15 minutos"
},

{
key:"bestTime",
question:"Qual horário você rende melhor?",
placeholder:"Ex: Noite"
},

{
key:"learningStyle",
question:"Como você aprende melhor?",
placeholder:"Ex: Visual e prática"
},

{
key:"difficulty",
question:"O que normalmente faz você desistir?",
placeholder:"Ex: Procrastinação"
}

]

function save(){

localStorage.setItem(
"tutorAI",
JSON.stringify(state)
)

}

function renderLanding(){

app.innerHTML = `

<section class="hero">

<div class="container">

<div class="hero-content">

<div class="fade">

<div class="glass badge">
🚀 AI Emotional Learning System
</div>

<h1 class="hero-title">
Aprenda com uma IA que entende você
</h1>

<p class="hero-description">

Uma plataforma inteligente que adapta:
ritmo, dificuldade, motivação, tempo e formato de estudo com base no seu comportamento.

</p>

<button
class="btn btn-primary"
onclick="${
state.plan
? 'renderDashboard()'
: 'startOnboarding()'
}"
style="
padding:20px 36px;
border-radius:22px;
font-size:18px;
">

${
state.plan
? 'Continuar Jornada →'
: 'Começar Jornada →'
}

</button>

</div>

<div class="glass card fade">

<div style="
display:flex;
justify-content:space-between;
margin-bottom:28px;
">

<div>

<div style="
color:var(--muted);
margin-bottom:8px;
">
Sistema
</div>

<div style="
font-size:32px;
font-weight:800;
">
Tutor Evolutivo AI
</div>

</div>

<div class="level">
🧠 IA Ativa
</div>

</div>

<div class="roadmap-item">
<span>✅ IA emocional</span>
<span>100%</span>
</div>

<div class="roadmap-item">
<span>⚡ Anti abandono</span>
<span>100%</span>
</div>

<div class="roadmap-item">
<span>🚀 Aprendizado adaptativo</span>
<span>100%</span>
</div>

<div class="lesson-box"
style="margin-top:20px;">

A IA entende:
- emoção,
- tempo,
- procrastinação,
- dificuldade,
- energia mental.

</div>

</div>

</div>

</div>

</section>

`

}

function startOnboarding(){

renderQuestion()

}

function renderQuestion(){

const q = questions[currentQuestion]

const pct =
(currentQuestion/questions.length)*100

app.innerHTML = `

<section style="
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
">

<div class="glass card fade"
style="
width:100%;
max-width:650px;
">

<div class="progress"
style="margin-bottom:14px;">

<div
class="progress-bar"
style="width:${pct}%;">
</div>

</div>

<div style="
font-size:13px;
color:var(--muted);
margin-bottom:28px;
">

Etapa ${currentQuestion+1} de ${questions.length}

</div>

<h1 style="
font-size:48px;
line-height:1.2;
margin-bottom:28px;
">

${q.question}

</h1>

<input
id="answer"
class="input"
placeholder="${q.placeholder}"
onkeypress="if(event.key==='Enter')nextQuestion()"
/>

<button
class="btn btn-primary"
onclick="nextQuestion()"
style="
width:100%;
padding:18px;
border-radius:20px;
margin-top:18px;
font-size:18px;
">

Continuar →

</button>

</div>

</section>

`

setTimeout(()=>{

document.getElementById("answer").focus()

},100)

}

function nextQuestion(){

const input =
document.getElementById("answer")

const value =
input.value.trim()

if(!value){

input.style.borderColor =
"var(--red)"

return

}

state.userData[
questions[currentQuestion].key
] = value

save()

currentQuestion++

if(currentQuestion >= questions.length){

generatePlan()
return

}

renderQuestion()

}

function generatePlan(){

state.plan = {

roadmap:[

{
title:"Mentalidade",
status:"done",
percent:100
},

{
title:"Fundamentos",
status:"active",
percent:42
},

{
title:"Prática",
status:"locked",
percent:0
},

{
title:"Especialização",
status:"locked",
percent:0
}

]

}

save()

renderDashboard()

}

function renderDashboard(){

const user = state.userData

if(state.chatHistory.length === 0){

state.chatHistory.push({

role:"assistant",

content:`
Olá.

Analisei seu perfil.

Seu foco atual é:
${user.goal}.

Seu maior risco de abandono:
${user.difficulty}.

Vou adaptar sua rotina baseada:
- no seu horário ideal,
- energia mental,
- nível de dificuldade,
- consistência.

`

})

save()

}

app.innerHTML = `

<div class="container fade">

<div style="
display:flex;
justify-content:space-between;
gap:20px;
flex-wrap:wrap;
margin-bottom:28px;
">

<div>

<h1 style="
font-size:58px;
margin-bottom:12px;
">
Tutor Evolutivo AI
</h1>

<p style="
font-size:18px;
color:var(--muted);
">

Sistema emocional de aprendizado adaptativo.

</p>

</div>

<div style="
display:flex;
gap:12px;
flex-wrap:wrap;
align-items:center;
">

<div class="level">
🔥 ${state.streak} dias
</div>

<div class="level">
⭐ ${state.xp} XP
</div>

<div class="level">
🏆 ${state.level}
</div>

</div>

</div>

<div class="grid grid-3"
style="margin-bottom:20px;">

<div class="glass card">

<div style="
color:var(--muted);
margin-bottom:8px;
">
Objetivo
</div>

<div style="
font-size:24px;
font-weight:700;
">
${user.goal}
</div>

</div>

<div class="glass card">

<div style="
color:var(--muted);
margin-bottom:8px;
">
Melhor horário
</div>

<div style="
font-size:24px;
font-weight:700;
">
${user.bestTime}
</div>

</div>

<div class="glass card">

<div style="
color:var(--muted);
margin-bottom:8px;
">
Maior dificuldade
</div>

<div style="
font-size:24px;
font-weight:700;
">
${user.difficulty}
</div>

</div>

</div>

<div class="grid grid-2">

<div class="glass card">

<h2 style="
font-size:32px;
margin-bottom:24px;
">
Roadmap Inteligente
</h2>

${state.plan.roadmap.map(item=>`

<div class="roadmap-item">

<span>

${
item.status==="done"
? "✅"
: item.status==="active"
? "⏳"
: "🔒"
}

${item.title}

</span>

<span>
${item.percent}%
</span>

</div>

`).join("")}

<div class="lesson-box"
style="margin-top:20px;">

🧠 A IA percebeu que você aprende melhor usando:
<strong>${user.learningStyle}</strong>

</div>

</div>

<div style="
display:flex;
flex-direction:column;
gap:18px;
">

<div class="glass card">

<h2 style="
font-size:28px;
margin-bottom:18px;
">
📚 Materiais Inteligentes
</h2>

<p style="
color:var(--muted);
line-height:1.7;
margin-bottom:20px;
">

A IA adapta o formato ideal para você.

</p>

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
">

<button
class="btn btn-soft"
onclick="generateMaterial('pdf')"
style="
padding:16px;
border-radius:18px;
">

📄 PDF

</button>

<button
class="btn btn-soft"
onclick="generateMaterial('podcast')"
style="
padding:16px;
border-radius:18px;
">

🎙️ Podcast

</button>

<button
class="btn btn-soft"
onclick="generateMaterial('flashcards')"
style="
padding:16px;
border-radius:18px;
">

🧠 Flashcards

</button>

<button
class="btn btn-soft"
onclick="generateMaterial('quiz')"
style="
padding:16px;
border-radius:18px;
">

❓ Quiz

</button>

</div>

</div>

<div class="glass card">

<h2 style="
font-size:28px;
margin-bottom:18px;
">
🚨 Sistema Anti-Abandono
</h2>

<p style="
line-height:1.8;
color:var(--muted);
margin-bottom:18px;
">

O tutor detecta:
- procrastinação,
- queda de energia,
- desânimo,
- dificuldade.

</p>

<button
class="btn btn-primary"
onclick="simulateDropout()"
style="
width:100%;
padding:16px;
border-radius:18px;
">

Ativar Simulação →

</button>

</div>

</div>

</div>

<div class="glass card"
style="margin-top:22px;">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;
">

<h2 style="
font-size:32px;
">
🤖 Tutor Inteligente
</h2>

<div class="level">
Memória Emocional Ativa
</div>

</div>

<div
id="chat"
class="chat">

${renderChatHistory()}

</div>

<div style="
display:flex;
gap:12px;
margin-top:18px;
">

<input
id="chatInput"
class="input"
placeholder="Pergunte algo ao tutor..."
onkeypress="if(event.key==='Enter')sendMessage()"
/>

<button
class="btn btn-primary"
onclick="sendMessage()"
style="
padding:0 28px;
border-radius:18px;
">

→

</button>

</div>

</div>

</div>

`

scrollChat()

}

function renderChatHistory(){

return state.chatHistory.map(msg=>`

<div class="bubble ${
msg.role === "user"
? "user"
: "ai"
} fade">

${msg.content}

</div>

`).join("")

}

function sendMessage(){

const input =
document.getElementById("chatInput")

const value =
input.value.trim()

if(!value)return

state.chatHistory.push({

role:"user",
content:value

})

const reply = generateReply(value)

state.chatHistory.push({

role:"assistant",
content:reply

})

save()

renderDashboard()

}

function generateReply(message){

const user = state.userData

const lower =
message.toLowerCase()

if(lower.includes("desmotivado")){

return `
Tudo bem desacelerar.

Vou reduzir sua carga mental hoje e adaptar seu estudo para sessões leves de 10 minutos.
`

}

if(lower.includes("cansado")){

return `
Você não precisa estudar pesado hoje.

Vou transformar o próximo conteúdo em formato mais leve:
- podcast,
- resumo rápido,
- micro aprendizado.
`

}

if(lower.includes("procrast")){

return `
A procrastinação normalmente aparece quando o cérebro percebe excesso de esforço.

Vamos quebrar isso em pequenas vitórias rápidas.
`

}

return `
Entendi.

Como seu objetivo é:
${user.goal},

vou continuar adaptando:
- intensidade,
- ritmo,
- profundidade,
- formato de conteúdo.

`

}

function generateMaterial(type){

showModal(`

<div style="text-align:center;">

<div style="
font-size:64px;
margin-bottom:20px;
">

${
type === "pdf"
? "📄"
: type === "podcast"
? "🎙️"
: type === "flashcards"
? "🧠"
: "❓"
}

</div>

<h2 style="
font-size:36px;
margin-bottom:18px;
">

${
type === "pdf"
? "PDF Inteligente"
: type === "podcast"
? "Podcast Inteligente"
: type === "flashcards"
? "Flashcards Inteligentes"
: "Quiz Inteligente"
}

</h2>

<div class="lesson-box"
style="margin-bottom:24px;">

A IA criou um material adaptado:
- ao seu tempo,
- ao seu estilo de aprendizado,
- ao seu nível atual.

</div>

<button
class="btn btn-primary"
onclick="closeModal()"
style="
width:100%;
padding:18px;
border-radius:18px;
">

Continuar

</button>

</div>

`)

}

function simulateDropout(){

showModal(`

<div>

<h2 style="
font-size:32px;
margin-bottom:18px;
">
🚨 Detectamos uma pausa
</h2>

<p style="
line-height:1.8;
color:var(--muted);
margin-bottom:20px;
">

O que mais dificultou sua continuidade?

</p>

<div style="
display:flex;
flex-direction:column;
gap:12px;
">

<button
class="btn btn-soft"
style="
padding:16px;
border-radius:16px;
"
onclick="dropoutReason('tempo')">

⏰ Falta de tempo

</button>

<button
class="btn btn-soft"
style="
padding:16px;
border-radius:16px;
"
onclick="dropoutReason('dificuldade')">

📚 Conteúdo difícil

</button>

<button
class="btn btn-soft"
style="
padding:16px;
border-radius:16px;
"
onclick="dropoutReason('desmotivacao')">

😔 Desmotivação

</button>

<button
class="btn btn-soft"
style="
padding:16px;
border-radius:16px;
"
onclick="dropoutReason('cansaco')">

😴 Cansaço mental

</button>

</div>

</div>

`)

}

function dropoutReason(reason){

const responses = {

tempo:`
Vou reduzir suas sessões para micro aprendizado de 10 minutos.
`,

dificuldade:`
Vou simplificar os próximos conteúdos usando:
- resumos rápidos,
- exemplos práticos,
- flashcards.
`,

desmotivacao:`
Vamos recuperar sua evolução com pequenas vitórias rápidas.
`,

cansaco:`
Vou transformar seus próximos conteúdos em formatos mais leves.
`

}

showModal(`

<div style="text-align:center;">

<div style="
font-size:64px;
margin-bottom:20px;
">
🧠
</div>

<h2 style="
font-size:34px;
margin-bottom:18px;
">
Tutor Adaptado
</h2>

<div class="lesson-box"
style="margin-bottom:24px;">

${responses[reason]}

</div>

<button
class="btn btn-primary"
onclick="closeModal()"
style="
width:100%;
padding:18px;
border-radius:18px;
">

Continuar Jornada

</button>

</div>

`)

}

function scrollChat(){

const chat =
document.getElementById("chat")

if(chat){

chat.scrollTop =
chat.scrollHeight

}

}

function showModal(content){

closeModal()

const modal =
document.createElement("div")

modal.id = "modal"

modal.className = "modal"

modal.innerHTML = `

<div class="modal-box fade">

${content}

</div>

`

document.body.appendChild(modal)

}

function closeModal(){

const modal =
document.getElementById("modal")

if(modal){

modal.remove()

}

}

renderLanding()

</script>

</body>
</html>
